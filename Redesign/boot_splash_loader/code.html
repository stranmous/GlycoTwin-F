<script>
  // Soft haptic-like playful particle micro-interaction
  document.addEventListener("DOMContentLoaded", () => {
    const badge = document.querySelector(".w-\\[88px\\]");
    if (badge) {
      badge.addEventListener("pointerdown", () => {
        badge.style.transform = "scale(0.94) rotate(-3deg)";
      });
      badge.addEventListener("pointerup", () => {
        badge.style.transform = "scale(1.04) rotate(2deg)";

          badge.style.transform = "";
        }, 220);
      });
    }
