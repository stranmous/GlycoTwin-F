<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed": "#c9eade", "surface-dim": "#dcd9d9", "pastel-lavender": "#E8DEF8", "primary": "#006a61", "on-primary-fixed-variant": "#005048", "range-warning": "#FFB347", "on-background": "#1b1c1c", "surface-container-high": "#eae8e7", "pastel-butter": "#FFF3CD", "on-secondary-container": "#286f44", "error-container": "#ffdad6", "primary-container": "#2aa89a", "on-tertiary-container": "#17342c", "surface": "#fbf9f8", "on-error-container": "#93000a", "on-secondary": "#ffffff", "inverse-on-surface": "#f3f0f0", "surface-tint": "#006a61", "secondary": "#236b40", "background": "#fbf9f8", "background-secondary": "#FFF5EB", "inverse-surface": "#303030", "outline-variant": "#bcc9c6", "on-error": "#ffffff", "on-tertiary": "#ffffff", "surface-variant": "#e4e2e1", "on-tertiary-fixed-variant": "#2f4c44", "secondary-fixed-dim": "#8ed7a1", "surface-container-low": "#f5f3f2", "on-primary-fixed": "#00201c", "tertiary-container": "#7e9d93", "text-secondary": "#8E8E8E", "secondary-container": "#a6f0b9", "range-below": "#E57373", "primary-fixed": "#84f6e6", "on-surface-variant": "#3d4947", "surface-container-lowest": "#ffffff", "error": "#ba1a1a", "secondary-fixed": "#a9f3bc", "on-primary-container": "#003631", "on-surface": "#1b1c1c", "on-tertiary-fixed": "#022019", "primary-fixed-dim": "#66d9ca", "range-above": "#FF8A80", "surface-container-highest": "#e4e2 imary text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased selection:bg-pastel-peach selection:text-primary"><header class="fixed top-0 inset-x-0 z-50 bg-background-primary/80 backdrop-blur-xl pt-safe shadow-[0_4px_14px_rgba(61,61,61,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><button aria-label="Go back" class="w-11 h-11 rounded-full bg-surface-card flex items-center justify-center text-on-surface shadow-[0_2px_8px_rgba(61,61,61,0.06)] active:scale-95 transition-transform" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><div class="flex items-center gap-space-xs"><div class="w-6 h-6 rounded-full bg-primary-container/20 flex items-center justify-center text-primary"><span class="material-symbols-outlined text-[16px]">water_drop</span></div><h1 class="font-title-md text-title-md text-on-surface tracking-tight">Meal Camera Scanner</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col flex-1 relative w-full pt-16 pb-safe bg-background-primary"><div class="flex flex-col w-full relative select-none overflow-hidden">
<!-- Live Camera Viewport Container -->
<div class="relative w-full aspect-[9/16] max-h-[820px] rounded-lg overflow-hidden bg-on-background shadow-xl flex flex-col justify-between">
<!-- Realistic Photographic Viewfinder Background -->
<div class="absolute inset-0 bg-cover bg-center w-full h-full scale-[1.02] transform transition-transform duration-700 ease-out" data-alt="An overhead warm culinary photograph of a vibrant South Asian lunch thali on a rustic wooden dining table. Includes fluffy aromatic basmati rice, rich succulent chicken karahi curry glistening in a miniature copper handi, golden folded whole wheat roti bread, and cooling shredded cucumber raita in a tiny ceramic bowl with fresh mint garnish, bathed in soft afternoon window light." id="cameraFeed" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB0or8_hpM0rVkLwFi7BfWssLpodbPLU33Lpp330cUMzwMuQE9V3G9AN1NXk5JGlhK60k15H6Fh-mQTFvN6FZI5yBW0cUsUnhD894EnDCS5iv2CvVNvAMhaFANBqw3cVRUW18_OnTP4xZMRZTS1-xKpuVN2TAMbZx2hNl_R-6kZi63Ui4WB8WkUVkDKmxaMwKGtDtKqKdGjcur3pB_jrqj5jtFzj-VCjJibFoGhQCRTDae-SHWAMgoe')"></div>
<!-- Soft Ambient Dark Gradients for Readability -->
<div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-on-background/60 via-on-background/25 to-transparent pointer-events-none z-10"></div>
<div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-on-background/80 via-on-background/40 to-transparent pointer-events-none z-10"></div>
<!-- Top Navigation & Live Detection Status -->
<div class="relative z-20 flex items-center justify-between px-space-md pt-space-md">
<!-- Close / Back Button -->
<button aria-label="Exit camera view" class="w-11 h-11 rounded-full bg-surface-card/75 backdrop-blur-md flex items-center justify-center text-on-surface shadow-md active:scale-90 transition-transform duration-150" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-title-md">close</span>
</button>
<!-- Center AI Status Pill -->
<div class="flex items-center gap-space-xs px-space-md py-1.5 rounded-full bg-surface-card/85 backdrop-blur-md shadow-md animate-pulse">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="font-label-sm text-label-sm text-on-surface tracking-wide uppercase">AI Detection Active ✨</span>
</div>
<!-- Flash Toggle Button -->
<button aria-label="Toggle camera flash" class="w-11 h-11 rounded-full bg-surface-card/75 backdrop-blur-md flex items-center justify-center text-on-surface shadow-md active:scale-90 transition-transform duration-150" id="flashToggleBtn" onclick="toggleFlash()" type="button">
<span class="material-symbols-outlined text-title-md text-on-surface" id="flashIcon">flash_off</span>
</button>
</div>
<!-- Center Viewfinder with Interactive Rounded Corner Brackets & Detection Badges -->
<div class="relative z-20 flex-1 flex items-center justify-center p-space-md">
<div class="relative w-full max-w-[320px] aspect-square flex items-center justify-center">
<!-- Viewfinder Reticle Corners -->
<svg class="absolute inset-0 w-full h-full pointer-events-none drop-shadow-[0_0_12px_rgba(42,168,154,0.45)]" fill="none" viewbox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
<!-- Top Left -->
<path d="M 12 56 L 12 36 A 24 24 0 0 1 36 12 L 56 12" stroke="#2AA89A" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Top Right -->
<path d="M 224 12 L 244 12 A 24 24 0 0 1 268 36 L 268 56" stroke="#2AA89A" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Bottom Left -->
<path d="M 12 224 L 12 244 A 24 24 0 0 0 36 268 L 56 268" stroke="#2AA89A" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Bottom Right -->
<path d="M 224 268 L 244 268 A 24 24 0 0 0 268 244 L 268 224" stroke="#2AA89A" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Subtle Subtle Reticle Center Target -->
<circle cx="140" cy="140" fill="#2AA89A" fill-opacity="0.8" r="4"></circle>
</svg>
<!-- Dynamic AI Food Detection Tags (Positioned over corresponding plate items) -->
<!-- 1. Over Basmati Rice (Center Top Area) -->
<div class="absolute top-8 left-6 group cursor-pointer transition-transform hover:scale-105 active:scale-95">
<div class="relative flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-card/90 backdrop-blur-md shadow-md">
<span class="w-2 h-2 rounded-full bg-primary-container animate-ping absolute -top-0.5 -right-0.5"></span>
<span class="text-label-md">🍚</span>
<span class="font-label-md text-label-md text-on-surface">Basmati Rice</span>
<span class="px-1.5 py-0.5 rounded-full bg-tertiary-fixed font-label-sm text-label-sm text-on-tertiary-container">~140g</span>
</div>
</div>
<!-- 2. Over Chicken Karahi (Right / Mid-Lower Area) -->
<div class="absolute bottom-20 right-3 group cursor-pointer transition-transform hover:scale-105 active:scale-95">
<div class="relative flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-card/90 backdrop-blur-md shadow-md">
<span class="text-label-md">🍗</span>
<span class="font-label-md text-label-md text-on-surface">Chicken Karahi</span>
<span class="px-1.5 py-0.5 rounded-full bg-pastel-peach font-label-sm text-label-sm text-error">~210g</span>
</div>
</div>
<!-- 3. Over Whole Wheat Roti (Left / Mid Area) -->
<div class="absolute bottom-10 left-4 group cursor-pointer transition-transform hover:scale-105 active:scale-95">
<div class="relative flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-card/90 backdrop-blur-md shadow-md">
<span class="text-label-md">🫓</span>
<span class="font-label-md text-label-md text-on-surface">Roti (Wheat)</span>
<span class="px-1.5 py-0.5 rounded-full bg-pastel-butter font-label-sm text-label-sm text-on-surface">1 Pc</span>
</div>
</div>
</div>
</div>
<!-- Bottom Controls Deck & Friendly Coaching Guidance -->
<div class="relative z-20 flex flex-col items-center px-space-md pb-space-lg gap-space-md">
<!-- Scaling Guidance Pill -->
<div class="flex items-center gap-space-xs px-space-md py-2 rounded-full bg-surface-card/85 backdrop-blur-md shadow-md max-w-sm">
<span class="text-label-md">💡</span>
<p class="font-body-sm text-body-sm text-on-surface leading-tight">
<span class="font-label-md text-label-md text-on-surface">Tip:</span> Include a spoon or plate rim for exact metabolic scaling
        </p>
</div>
<!-- Action Button Strip -->
<div class="w-full flex items-center justify-between px-space-xs">
<!-- Gallery Button -->
<button class="flex items-center gap-space-xs px-space-md h-12 rounded-full bg-surface-card/80 backdrop-blur-md text-on-surface shadow-md active:scale-95 transition-all" onclick="triggerGallery()" type="button">
<span class="text-label-lg">🖼️</span>
<span class="font-label-md text-label-md text-on-surface">Gallery</span>
</button>
<!-- Ergonomic Shutter Button with Visual Glow -->
<button aria-label="Capture meal photo" class="relative w-20 h-20 rounded-full flex items-center justify-center p-1 bg-surface-card/40 backdrop-blur-md shadow-lg active:scale-90 transition-transform duration-150" id="shutterBtn" onclick="capturePhoto()" type="button">
<!-- Outer White Separator Ring -->
<div class="w-full h-full rounded-full bg-surface-card flex items-center justify-center shadow-inner">
<!-- Center Solid Warm Teal Trigger -->
<div class="w-14 h-14 rounded-full bg-primary-container flex items-center justify-center shadow-[0_4px_16px_rgba(42,168,154,0.45)]">
<span class="material-symbols-outlined text-on-primary text-title-md">photo_camera</span>
</div>
</div>
</button>
<!-- Manual Log Button -->
<button class="flex items-center gap-space-xs px-space-md h-12 rounded-full bg-surface-card/80 backdrop-blur-md text-on-surface shadow-md active:scale-95 transition-all" onclick="triggerManualLog()" type="button">
<span class="text-label-lg">⚡</span>
<span class="font-label-md text-label-md text-on-surface">Manual</span>
</button>
</div>
</div>
<!-- Flash Screen Feedback Effect (Hidden by default) -->
<div class="absolute inset-0 bg-surface-card opacity-0 pointer-events-none z-30 transition-opacity duration-150" id="captureFlash"></div>
</div>
<!-- Interactive Feedback Drawer Preview (Revealed on Snap) -->
<div class="hidden fixed bottom-6 inset-x-6 z-50 p-space-md rounded-DEFAULT bg-surface-card shadow-xl flex items-center justify-between" id="captureToast">
<div class="flex items-center gap-space-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-label-lg">
        ✓
      </div>
<div>
<p class="font-title-md text-title-md text-on-surface">Meal Scanned</p>
<p class="font-body-sm text-body-sm text-text-secondary">Simulating glucose response curve...</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary border-t-transparent animate-spin"></div>
</div>
</div>
<script>
  let flashActive = false;

  function toggleFlash() {
    flashActive = !flashActive;
    const icon = document.getElementById('flashIcon');
    const btn = document.getElementById('flashToggleBtn');
    if (flashActive) {
      icon.innerText = 'flash_on';
      icon.classList.add('text-range-warning');
      btn.classList.add('bg-pastel-butter/90');
    } else {
      icon.innerText = 'flash_off';
      icon.classList.remove('text-range-warning');
      btn.classList.remove('bg-pastel-butter/90');
    }
  }

  function capturePhoto() {
    const flashEl = document.getElementById('captureFlash');
    const toastEl = document.getElementById('captureToast');
    
    // Shutter flash effect
    flashEl.classList.remove('opacity-0');
    flashEl.classList.add('opacity-90');
    
    setTimeout(() => {
      flashEl.classList.remove('opacity-90');
      flashEl.classList.add('opacity-0');
    }, 120);

    // Provide friendly delight feedback
    setTimeout(() => {
      toastEl.classList.remove('hidden');
      setTimeout(() => {
        toastEl.classList.add('hidden');
      }, 2400);
    }, 200);
  }

  function triggerGallery() {
    const toastEl = document.getElementById('captureToast');
    toastEl.querySelector('.font-title-md').innerText = 'Opening Gallery...';
    toastEl.querySelector('.text-text-secondary').innerText = 'Selecting meal image from photos';
    toastEl.classList.remove('hidden');
    setTimeout(() => toastEl.classList.add('hidden'), 1800);
  }

  function triggerManualLog() {
    const toastEl = document.getElementById('captureToast');
    toastEl.querySelector('.font-title-md').innerText = 'Opening Quick Log';
    toastEl.querySelector('.text-text-secondary').innerText = 'Switching to text and carb search mode';
    toastEl.classList.remove('hidden');
    setTimeout(() => toastEl.classList.add('hidden'), 1800);
  }
</script></main></body></html>
